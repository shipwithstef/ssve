    - finding_id: F3
      decision: ACCEPT
      justification: "Repo supports 5 hosts; T2 hardcoded ~/.claude/skills only."
      action: "Manifest T2 contract revised: iterate over [~/.claude/skills, ~/.kimi/skills, ~/.codex/skills, ~/.gemini/skills, ~/.config/opencode/skills]; skip-with-PASS when no host root exists; mirror the existing validate-claude-skills-symlinks.sh convention."

    - finding_id: F4
      decision: ACCEPT
      justification: "Real contradiction. AC-06 cannot be both pre-promotion required AND only verified post-merge at T7."
      action: "Manifest revised: branch-level validation step 3 (manual smoke per AC-06) removed; AC-06 moved entirely to T7/verify-promotion as a promotion-time check. Pre-promotion gate is now T6 tier-1 sweep + lint-skills-manifest + exact 6-file diff."

    - finding_id: F5
      decision: ACCEPT
      justification: "Multiple non-worktree clones can match Strategy 3's filesystem scan; without tie-break the wrong clone could be picked."
      action: "Manifest revised: Strategy 3 candidate validation now requires all of {setup, hooks/svc-session-start-healthcheck.mjs, skills-manifest.json}; tie-break order = (a) basename match seriousvibecoding, (b) realpath canonical, (c) most-recently-modified setup mtime; if >1 candidate remains after filters, log all and fall through to existing warn-and-exit-0 unless $SVC_REPO_SEARCH_PATHS is set to a single root."

    - finding_id: F6
      decision: ACCEPT
      justification: "Real but minor. Files-planned table has 6 rows; prose said 5–6."
      action: "Manifest revised: branch-level validation step 3 now lists the exact 6 paths; promotion checklist reuses the same explicit list."

  tier3:

        and write-spec are not in that list.
      counter_evidence:
        - file: scripts/validate-task-graph-lane.mjs
          lines: "87-94"
          assertion: "Bugfix lane mandatory = [diagnose-bug, review-gate, land-changeset, verify-promotion]"
        - command: "node scripts/validate-task-graph-lane.mjs .svc/lane-tasks-WI-134.json"
          output: "{ pass: true, missing: [] }"
        - file: .svc/lane-tasks-WI-134.json
          assertion: "All 4 mandatory bugfix skills present as tasks (1: diagnose-bug, 4: review-gate, 6: land-changeset, 7: verify-promotion)"
      action: "no manifest change; mechanical lane-validator output is authoritative"

    - finding_id: F2

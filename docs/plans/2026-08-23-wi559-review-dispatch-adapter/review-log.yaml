    decision: ACCEPT
    justification: Installed transport capability is volatile and cheap to prove before dispatch.
    action: Recorded version, help, authentication, bounded flags, and forbidden approval modes in research, probes, and the contract map.
  - finding_id: F-003
    decision: PARTIAL
    justification: The attestation gap is valid, but protected policy proves Cursor carries both Anthropic Fable and OpenAI Sol review stations, so an Anthropic-only pairing would incorrectly reject an authorized station.
    accepted_part: Cursor success must require requested_accepted or stronger attestation and reject level none.
    rejected_part: Cursor may pair only with Anthropic.
    counter_proposal: Permit only the protected review pairs Cursor+Anthropic and Cursor+OpenAI; require exact findings host/family match and requested_accepted or stronger attestation.
    counter_evidence: ~/.svc/dispatch-policy.json mixed-grok-cursor plan stations fable and sol-high
  - finding_id: F-004
    decision: ACCEPT
    justification: The contract map must cover every cross-system authority boundary introduced by the design.
    action: Added Cursor invariant, falsification, and old/new-path rows.
  - finding_id: F-005
    decision: ACCEPT
    justification: Exact flag traceability prevents a green AC that omits a blueprint-mandated containment flag.
    action: Unified the Cursor probe set and added --single to AC-559-5.

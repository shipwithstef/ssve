        severity: medium
        claim: "Foreign-host stale-lock age was not constrained above legitimate two-attempt wall time."
        response:
          decision: ACCEPT
          justification: "A foreign host cannot inspect local process identity, so an inequality plus owner heartbeat is required to prevent mid-call reclaim."
          action: "Added 300-second per-attempt default, 720-second stale default, startup constraint stale >= 2*timeout+60, and 30-second owner-token heartbeat with fixtures."
      - id: F2
        severity: low
        claim: "Task Graph AC ranges disagreed with the AC-to-Task mapping for EXTREV-19, 30, 63, and 64."
        response:
          decision: ACCEPT
          justification: "Both tables are execution authority and must name identical task ownership."
          action: "Removed EXTREV-19/30 from task-1 and EXTREV-63/64 from task-5; detailed mappings remain authoritative and consistent."
      - id: F3
        severity: low
        claim: "Owner-override authority lacked a trust anchor."
        response:
          decision: ACCEPT
          justification: "Self-declared provenance is audit logging, not authorization."
          action: "Required repository-owner authority and exact byte match to out-of-band SVC_EXTERNAL_REVIEW_OWNER_OVERRIDE_SHA256, with missing/mismatch/unlisted fixtures."
      - id: F4
        severity: low
        claim: "Kill-switch mechanism was not named in the manifest launcher contract."
        response:
          decision: ACCEPT
          justification: "Adapters, docs, receipts, and fixtures need one exact operator-facing name."
          action: "Named SVC_EXTERNAL_REVIEW_DISABLED=1 as the non-overridable pre-cache/pre-lock/pre-spawn switch and disabled receipt path."

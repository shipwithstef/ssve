  iteration_1:
    reviewer: claude-fable-5
    reviewer_family: anthropic
    effort: high
    rubric_score: 8
    rubric_failures: [2, 5]
    lane_compliance: PASS
    findings:
      - id: EXTREV-MAN-001
        severity: medium
        claim: "Exact HEAD==base guard makes checkpoint recovery reruns fail."
        analysis: "After checkpoint 1, HEAD is no longer the base even though the recovery contract requires downstream replay."
        evidence: "Execution sequence exact-HEAD assertion versus RECOVERY_IF_FAIL replay requirement."
        proposed_fix: "Use a base-ancestry assertion that remains true across checkpoints."
      - id: EXTREV-MAN-002
        severity: medium
        claim: "Upstream diagnosis/design/review/evidence artifacts and the plan lack Files Planned ownership."
        analysis: "Untracked prerequisite evidence could be omitted from checkpoints while later receipts cite it."
        evidence: "Prerequisite matrix paths absent from the original Files Planned table."
        proposed_fix: "Add every upstream evidence artifact and the review log to task-1 inventory."
      - id: EXTREV-MAN-003
        severity: medium
        claim: "Spend invariant overclaims a Codex monetary-budget control not present in Codex argv."
        analysis: "Claude has max-budget-usd; Codex is bounded by timer and call count."
        evidence: "Spend invariant versus provider-specific argv sections."
        proposed_fix: "State provider-specific bounds and map their fixtures precisely."
      - id: EXTREV-MAN-004
        severity: low
        claim: "Rollback lacks stash provenance and downstream-checkpoint invalidation."
        analysis: "The executor cannot identify the stash and a reverted dependency invalidates later checkpoints."
        evidence: "Rollback's unnamed stash and single-checkpoint wording."
        proposed_fix: "Record immutable stash commit/contents and rebuild all dependent checkpoints."
      - id: EXTREV-MAN-005
        severity: low
        claim: "A count-based full-suite comparison can hide a new failure when a baseline failure disappears."
        analysis: "Session freshness is state-dependent, so cardinality is not regression identity."
        evidence: "240/3 baseline wording and freshness caveat."
        proposed_fix: "Use an exact failing-test allowlist and subset gate."
      - id: EXTREV-MAN-006
        severity: low
        claim: "PID plus timestamp lock recovery is unsafe under PID reuse and foreign-host namespaces."
        analysis: "PID liveness alone does not identify the launcher process across reuse or hosts."
        evidence: "Cache section's original PID/timestamp rule."
        proposed_fix: "Bind hostname, PID, start token, owner token, and timestamp; fixture PID reuse/foreign host."
      - id: EXTREV-MAN-007
        severity: low
        claim: "Checkpoint timing and adjust-command-syntax wording are nondeterministic."
        analysis: "The manifest both delays all commits until final review and relies on per-task commit anchors; it also leaves exact flags to execution."
        evidence: "Checkpoint sentence and local-help adjustment clause."
        proposed_fix: "Clarify per-task commits and pin actual scan/receipt commands."
      - id: EXTREV-MAN-008
        severity: low
        claim: "Runtime cache has no retention or eviction lifecycle."
        analysis: "Launcher-version and package churn leave unbounded regenerable artifacts."
        evidence: "External-state row 15 and rollback-only deletion."
        proposed_fix: "Add lock-safe TTL-based explicit cache GC and fixtures."
    responses:
      - finding_id: EXTREV-MAN-001
        decision: ACCEPT
        justification: "A lineage assertion preserves branch binding without invalidating checkpoint reruns."
        action: "Replaced exact HEAD equality with base-is-ancestor validation."
      - finding_id: EXTREV-MAN-002
        decision: ACCEPT
        justification: "Every cited prerequisite must be part of the landed evidence set."
        action: "Added diagnosis, decisions, contract map, G4 review, both test-evidence files, manifest, and review log to task-1."
      - finding_id: EXTREV-MAN-003
        decision: ACCEPT
        justification: "The installed Codex CLI exposes no monetary-budget flag; timeout plus one attempt is the honest bound."
        action: "Made spend controls provider-specific and corrected the EXTREV-31 through 33 proof row."
      - finding_id: EXTREV-MAN-004
        decision: ACCEPT
        justification: "The stash is deliberate external state and dependency reversions invalidate derived evidence."
        action: "Recorded immutable stash commit, exact contents, and downstream checkpoint rebuild rule."
      - finding_id: EXTREV-MAN-005
        decision: ACCEPT
        justification: "Failure identities, not counts, prevent a disappearing known failure from masking a regression."
        action: "Pinned the three exact baseline validators and required post-failure-set subset comparison."
      - finding_id: EXTREV-MAN-006
        decision: ACCEPT
        justification: "Process identity and host scope are required before a stale-lock decision is safe."
        action: "Added hostname/PID/start/owner/timestamp lock identity and deterministic reuse/foreign-host fixtures."
      - finding_id: EXTREV-MAN-007
        decision: ACCEPT
        justification: "Reviewed commands and checkpoint boundaries must be executable without interpretation."
        action: "Clarified task-level checkpoint timing and pinned scan-concerns/check-chain-receipts syntax."
      - finding_id: EXTREV-MAN-008
        decision: ACCEPT
        justification: "Regenerable runtime evidence still needs a bounded removal lifecycle."
        action: "Added explicit lock-safe 30-day TTL GC command/configuration and held-lock fixtures."
  iteration_2:

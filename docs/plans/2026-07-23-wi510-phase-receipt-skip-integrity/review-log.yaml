      justification: Governance reviews and PR landing are external dependencies even though the product runtime has none.
      action: Added taxonomy entries 7 and 14, hard-failure receipts, and exact-SHA retry boundaries.
    - finding_id: round2-F-001
      decision: ACCEPT
      justification: Receipt presence is insufficient unless the reviewed diff and commit tree are mechanically identical.
      action: Added staged-tree/diff freeze, body equality, commit-tree equality, exact receipt emission, clean-tree checks.
    - finding_id: round2-F-002

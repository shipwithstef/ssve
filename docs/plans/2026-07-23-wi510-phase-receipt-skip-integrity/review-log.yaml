      justification: Every mandatory tracked output belongs inside the scope and exact staged set.
      action: Added exact cross-model, exec-review, security, and audit paths.
    - finding_id: round2-F-003
      decision: ACCEPT
      justification: Canonical current producers are normative evidence and cannot be invalidated by a new stricter path rule.
      action: Added contained OS-temp compatibility for file/command_output plus negative inversions.
    - finding_id: round2-F-004
      decision: ACCEPT
      justification: Registry membership is weaker than applicability.
      action: Source verification after round 3 showed delivery entries have no applicability object; the corrected design requires substantive canonical registry applicability fields plus non-empty delivery evidence and retains skip-condition-inapplicable for empty registry metadata.
    - finding_id: round2-F-005

      findings:
        - id: F-001
          severity: high
          claim: The frozen-tree lifecycle could not produce a completed authoritative outer task graph.
          analysis: Land and verify cannot truthfully complete until after the implementation squash is promoted.
          proposed_fix: Land the reviewed implementation with tasks 15 and 16 pending, then persist their actual receipts and statuses in an authorized governance-only follow-up commit.
        - id: F-002
          severity: high
          claim: Mandatory reviews, landing, and promotion receipt emission were not expressed as deterministic executable commands.
          analysis: Skill names and comments did not bind PR heads, exits, artifacts, receipt emission, or retry behavior.
          proposed_fix: Add exact activation/postconditions, PR-head assertions, merge commands, promoted receipt emission, and closeout commands.
        - id: F-003
          severity: medium
          claim: The WI-498 immutability check did not prove every protected historical surface.
          analysis: Shared append-only files and the consolidated notes ref require WI-498-specific target hashes.
          proposed_fix: Pin and recheck the graph, work item, promoted note payload, extracted WI-498 JSONL records, and checkpoint absence.
        - id: F-004
          severity: medium
          claim: The recorded base commit was not mechanically enforced before implementation or landing.
          analysis: A resumed worktree or advanced main could change the reviewed baseline.
          proposed_fix: Assert exact ancestry, bind review to the base-to-frozen-tree diff, and rerun review after integrating any advanced main.
  responses:

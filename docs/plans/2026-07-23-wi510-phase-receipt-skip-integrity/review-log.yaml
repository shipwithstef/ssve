      decision: ACCEPT
      justification: Final branch review and post-merge verification are different facts and must bind different immutable SHAs.
      action: Added separate lifecycle stages, clean-tree/HEAD assertions, and verify-promotion receipt-only post-merge truth.
    - finding_id: F-002
      decision: ACCEPT
      justification: Repository residue is protected and broad pathspecs violate the declared file boundary.
      action: Replaced directory staging with exact paths and a staged-path equality check.
    - finding_id: F-003
      decision: ACCEPT
      justification: A red test is evidence only when its expected cause is mechanically identified.
      action: Required focused exit 2 plus classifier-unavailable.
    - finding_id: F-004
      decision: ACCEPT
      justification: Inline mode removes payload duplication, not the need for deterministic interfaces and state semantics.
      action: Added exact exports, inputs/results, precedence, reason codes, flags, and exit codes.
    - finding_id: F-005

      decision: ACCEPT
      justification: Mandatory gates and promotion need inspectable inputs, outputs, and immutable SHA checks.
      action: Added task activation/postcondition rows, exact PR commands, head assertions, merge calls, receipt emission, and final replay.
    - finding_id: round3-F-003
      decision: ACCEPT
      justification: Append-only shared stores need target-specific preservation assertions.
      action: Added exact WI-498 graph, work-item, note, JSONL extraction, and checkpoint-absence hashes.
    - finding_id: round3-F-004
      decision: ACCEPT
      justification: Review authority is meaningful only against the exact declared base and final tree.
      action: Added ancestry assertions, base-to-tree diff hashing, and stop-integrate-rerun rules for an advanced main.

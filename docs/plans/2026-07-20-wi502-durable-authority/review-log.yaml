  receipt_path: .svc/external-review-artifacts/plan/WI-502-round3/receipt.json
  bounded_exit: true
  findings:
    - id: F-001
      severity: medium
      decision: ACCEPT
      justification: The repository does not currently ignore the proposed runtime evidence path.
      action: Allocate all red and file-universe evidence with mktemp outside the repository.
    - id: F-002
      severity: medium
      decision: ACCEPT
      justification: Prose-only resume is insufficient for a copy-paste execution sequence.
      action: Gate every task on its checkpoint ref and reconstruct PREV_SNAPSHOT from each completed ref.
    - id: F-003
      severity: medium
      decision: ACCEPT
      justification: Authority rollback must remove files created after the anchor, not only restore earlier bytes.
      action: Add an exact allowlisted restore recipe that restores the anchor and deletes rolled-back task paths absent from its tree.
    - id: F-004
      severity: low
      decision: ACCEPT
      justification: The execute entry point must not pretend a clean post-commit rerun is supported.
      action: Exit with an explicit redirect to the post-review entry point whenever HEAD differs from BASE.
    - id: F-005
      severity: low
      decision: ACCEPT
      justification: Any nonzero exit is not proof of the intended red contract.
      action: Require a unique stable WI502-RED marker from every expected failure.
    - id: F-006
      severity: low
      decision: ACCEPT
      justification: The live script supports --body, but stdin is the repository's documented and already-proven contract.
      action: Standardize both receipt loops on stdin redirection.

reviewer_discovery:
  id: WI-503
  description: The canonical adapter completed the Fable review and wrote a valid receipt, but its final receipt-display expression used require() on a relative custom artifacts path without a relative-path prefix. It printed MODULE_NOT_FOUND while returning success.
  disposition: File as a separate follow-up because it is unrelated to WI-502 authority semantics and did not invalidate the absolute receipt or findings.

post_review_local_discovery:
  issue: Concurrent svc-auto-drive appends can share the tracked pipeline-decisions JSONL ledger with the WI-502 lane decision.
  evidence: Default-checkout and worktree diffs contain different inode-local auto-drive appends; the WI-502 line exists only in the worktree.
  disposition: Preserve all unrelated bytes and make the execution index contain BASE plus exactly the unique WI-502 decision line. This is a local deterministic staging correction after the bounded third round, not a fourth adversarial review.

execution_deviation:
  issue: The reviewed file universe omitted scripts/codex-load-skill.mjs even though OS-09 and generation invalidation require the loader receipt to bind the current lease generation.
  classification: missing-critical auto-fix
  disposition: Add the loader to task 2 and the declared file universe; emit authority_model, authority_generation, lease_id, and principal_id into every new receipt. Old receipts fail closed and must be reissued.

# Temporary repair-only diagnostics; remove before the baseline repair is ready.
name: CI Repair Snapshot
on:
  push:
    branches: [fix/ci-baseline-repairs]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Capture Git objects without credentials or runner state
        run: |
          mkdir -p "$RUNNER_TEMP/ci-repair"
          git bundle create "$RUNNER_TEMP/ci-repair/source.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/ci-repair/revision.txt"
          sha256sum "$RUNNER_TEMP/ci-repair/source.bundle" > "$RUNNER_TEMP/ci-repair/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-repair-source
          path: ${{ runner.temp }}/ci-repair/
          retention-days: 1
          if-no-files-found: error

# Temporary repair-only validation; removed from the final repair tree.
name: CI Repair Validation
on:
  push:
    branches: [fix/ci-baseline-repairs]
permissions:
  contents: read
concurrency:
  group: ci-baseline-repair-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare the existing free-check dependency
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Prepare exact Git objects and run offline regression checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_PATCH_SHA256: 7fccdaf2f64d79f8e32a34d3f213330c6da5adfd8c966e9d05233640da110e8b
          EVALS: "0"
        run: python3 .github/ci-repair-prepare.py
      - name: Retain validation evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-repair-evidence
          path: ${{ runner.temp }}/ci-repair-evidence/
          retention-days: 1
          if-no-files-found: error

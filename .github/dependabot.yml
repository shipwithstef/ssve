# Active Dependabot configuration at its recognized GitHub path.
# See docs/ci/ACTIVATION.md for observed activation state.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope

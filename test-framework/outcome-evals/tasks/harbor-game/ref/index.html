<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Light</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #02070f; color: #f4f1e6; font: 16px system-ui; }
  main { position: relative; width: min(96vw, 800px); }
  canvas { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 12px; box-shadow: 0 0 60px #ffd36e22; }
  #overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: #02070fcc; border-radius: 12px; font-size: 20px; }
  #overlay[hidden] { display: none; }
</style>
<main>
  <canvas width="800" height="450" aria-label="Harbor Light game"></canvas>
  <div id="overlay">Guide ships past the rocks with your beam.<br>Up/Down or tap a lane to aim, Space for a wide flare. P pauses, R restarts.<br><br>Press Space to light the lamp</div>
</main>
<script type="module" src="game/client.js"></script>
</html>

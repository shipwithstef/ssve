<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Patch Island</title>
<style>
:root{--sea:#1f4e5f;--sand:#e9d8a6;--ink:#1b1b1e;--paper:#fbf6ea;--coral:#e76f51;--kelp:#2a9d8f}
body{margin:0;background:var(--sea);color:var(--paper);font:17px/1.5 Georgia,"Times New Roman",serif}
main{max-width:960px;margin:0 auto;padding:16px;display:grid;gap:12px}
h1{margin:0;font-size:1.6rem;letter-spacing:.02em}
#art{width:100%;max-width:100%;height:auto;border:3px solid var(--sand);border-radius:6px;background:var(--kelp)}
#text{background:var(--paper);color:var(--ink);padding:12px 14px;border-radius:6px;white-space:pre-wrap;min-height:4.5em}
#say{font-style:italic}
.panel{display:flex;flex-wrap:wrap;gap:8px}
.panel h2{width:100%;margin:6px 0 0;font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sand)}
button{font:inherit;font-size:.95rem;min-height:44px;padding:6px 12px;border:2px solid var(--sand);border-radius:6px;background:var(--ink);color:var(--paper);cursor:pointer}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.hot{cursor:pointer}
</style></head><body><main>
<h1 id="title">Patch Island</h1>
<svg id="art" viewBox="0 0 640 260" role="img" aria-label="The current scene"></svg>
<div id="text" aria-live="polite"></div>
<div id="verbs"></div>
</main><script type="module" src="/client.js"></script></body></html>

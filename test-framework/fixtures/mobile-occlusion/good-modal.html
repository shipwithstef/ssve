<!doctype html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*{box-sizing:border-box;margin:0}body{font-family:sans-serif}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100}
  .modal{position:fixed;left:24px;right:24px;top:120px;background:#fff;border-radius:12px;padding:24px;z-index:101}
</style></head>
<body>
  <!-- Background is intentionally inert behind an open modal — its buttons must
       NOT be reported as occluded (MO-06). -->
  <div aria-hidden="true" inert>
    <header style="padding:16px"><button>Menu</button></header>
    <button style="margin:16px">Background action</button>
  </div>
  <div class="backdrop"></div>
  <div class="modal" role="dialog"><p>Confirm?</p><button>OK</button></div>
</body></html>

<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: sans-serif; }
  /* FIX B2: the footer adds env(safe-area-inset-bottom) padding, keeping the
     button's tappable box above the home-indicator zone. */
  .footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: #f5f5f5;
  }
  .footer button { width: 100%; padding: 10px; border: 2px solid #a78bfa; border-radius: 8px; background: #fff; }
</style>
</head>
<body>
  <header><h1>Menu</h1></header>
  <div class="footer">
    <button data-testid="logout" aria-label="Log out">Log out</button>
  </div>
</body>
</html>
